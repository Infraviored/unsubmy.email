version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unsubmy-email-backend
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: always
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./client_secret.json:/app/client_secret.json:ro
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/unsubmyemail}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:-temporary-dev-key-1234567890}
    depends_on:
      - db
      - redis
    networks:
      - proxy-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unsubmy-email-worker
    command: celery -A app.worker.celery worker --loglevel=info
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: always
    volumes:
      - ./client_secret.json:/app/client_secret.json:ro
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/unsubmyemail}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:-temporary-dev-key-1234567890}
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - proxy-network


  db:
    image: postgres:15-alpine
    container_name: unsubmy-email-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-unsubmyemail}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - proxy-network

  redis:
    image: redis:7-alpine
    container_name: unsubmy-email-redis
    restart: always
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true

volumes:
  postgres_data: